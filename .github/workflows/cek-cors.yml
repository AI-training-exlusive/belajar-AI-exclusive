name: Cek CORS (sementara)
on:
  push:
    branches: [ci-cek-cors]
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: POST tanpa data (tidak menyimpan apa pun)
        run: |
          URL="https://script.google.com/macros/s/AKfycbzHNKd8RWTlwYRxcfMPvG_mH5AdENZt-BP2Nv11bGUNmLVhE-IyPZjT82-DUWrAGSsWkA/exec"
          curl -sS -D - -o body1.txt -X POST -H "Origin: https://ai-training-exlusive.github.io" \
            --data "format=json" "$URL" | grep -iE "^HTTP|^location|^access-control|^content-type" | sed -E 's/(user_content_key=)[^&]*/\1.../'
          echo "--- body awal:"; head -c 300 body1.txt; echo
          LOC=$(curl -sS -D - -o /dev/null -X POST --data "format=json" "$URL" | grep -i "^location" | tr -d '\r' | cut -d' ' -f2)
          echo "--- ikuti redirect (GET):"
          curl -sS -D - -o body2.txt -H "Origin: https://ai-training-exlusive.github.io" "$LOC" | grep -iE "^HTTP|^location|^access-control|^content-type"
          echo "--- body akhir:"; head -c 300 body2.txt; echo
