name: Cek link (sementara)
on:
  push:
    branches: [ci-cek-cors]
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=$(curl -sS -o /dev/null -w "%{redirect_url}" "https://maps.app.goo.gl/Eqbw839XBTK7faA59")
          echo "REDIR1: $U"
          curl -sS -L -o /dev/null -w "FINAL: %{url_effective}\n" "https://maps.app.goo.gl/Eqbw839XBTK7faA59"
