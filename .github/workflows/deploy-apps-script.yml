# Memasang ticket-system/Code.gs ke proyek Apps Script lalu memperbarui
# deployment web app yang sudah ada (alamat /exec tetap sama).
#
# Butuh secret repository CLASPRC_JSON (isi file .clasprc.json hasil `clasp login`).
# Tanpa secret itu, workflow berhenti dengan pesan dan tidak mengubah apa pun.
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ["ticket-system/Code.gs"]
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

env:
  SCRIPT_ID: "1L5gh6gUrXEyB9Cyytm5xMgTuW0M9Z3prmHB8Ov9-eLLMNhMJB_Yrl-Lq"
  DEPLOYMENT_ID: "AKfycbzHNKd8RWTlwYRxcfMPvG_mH5AdENZt-BP2Nv11bGUNmLVhE-IyPZjT82-DUWrAGSsWkA"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cek secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::Secret CLASPRC_JSON belum dipasang. Apps Script tidak diubah."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: "20"

      - name: Pasang clasp
        if: env.SKIP != '1'
        run: npm install -g @google/clasp@2.4.2

      - name: Tulis kredensial
        if: env.SKIP != '1'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Ambil proyek, ganti Code.gs, push
        if: env.SKIP != '1'
        run: |
          mkdir build && cd build
          printf '{"scriptId":"%s"}' "$SCRIPT_ID" > .clasp.json
          # Ambil isi proyek saat ini supaya appsscript.json (zona waktu, izin web app) tetap sama.
          clasp pull
          ls -la
          cp ../ticket-system/Code.gs Code.js
          clasp push --force

      - name: Perbarui deployment yang sudah ada
        if: env.SKIP != '1'
        run: |
          cd build
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
          clasp deployments

      - name: Hapus kredensial
        if: always()
        run: rm -f "$HOME/.clasprc.json"
